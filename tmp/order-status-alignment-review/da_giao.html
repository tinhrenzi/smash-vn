        /* ===== Badge Trạng thái ===== */
        .manage-o__badge {
            width: auto !important;
            min-width: 5.9375rem !important;

            padding: 6px 14px !important;
            display: inline-flex !important;

            justify-content: center !important;
        }
        .badge--pending   { background-color: #fff3cd !important; color: #856404 !important; }
        .badge--warning   { background-color: #ffeeb3 !important; color: #856404 !important; }
        .badge--processing{ background-color: #cce5ff !important; color: #004085 !important; }
        .badge--confirmed { background-color: #d0f0fd !important; color: #005f7a !important; }
        .badge--shipping  { background-color: #d1ecf1 !important; color: #0c5460 !important; }
        .badge--delivered { background-color: #d4edda !important; color: #155724 !important; }
        .badge--cancelled { background-color: #f8d7da !important; color: #721c24 !important; }

        /* ===== Nút hủy đơn ===== */
        #btn-huy-don {
            background-color: #e53935;
            border: none;
            color: #fff;
            font-weight: 700;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease, box-shadow 0.2s ease;
            font-size: 14px;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        #btn-huy-don:hover { background-color: #c62828; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(229,57,53,.35); }
        #btn-huy-don:active { transform: translateY(0); }
        #btn-huy-don:disabled { background-color: #aaa; cursor: not-allowed; transform: none; box-shadow: none; }

        /* ===== Modal Xác nhận hủy ===== */
        .cancel-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(3px);
        }
        .cancel-modal-overlay.active { display: flex; }
        .cancel-modal {
            background: #fff;
            border-radius: 14px;
            padding: 36px 32px 28px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.22);
            animation: modalIn 0.28s cubic-bezier(.34,1.56,.64,1) both;
        }
        @keyframes modalIn {
            from { opacity:0; transform: scale(0.88) translateY(20px); }
            to   { opacity:1; transform: scale(1) translateY(0); }
        }
        .cancel-modal__icon { font-size: 52px; margin-bottom: 14px; display: block; }
        .cancel-modal__title { font-size: 20px; font-weight: 800; color: #212121; margin-bottom: 8px; }
        .cancel-modal__desc  { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.6; }
        .cancel-modal__actions { display: flex; gap: 12px; justify-content: center; }
        .btn-modal-confirm {
            background: #e53935; color: #fff; border: none;
            padding: 11px 28px; border-radius: 7px; font-weight: 700;
            cursor: pointer; font-size: 14px; transition: background 0.2s ease;
        }
        .btn-modal-confirm:hover { background: #c62828; }
        .btn-modal-cancel {
            background: #f5f5f5; color: #555; border: 1px solid #ddd;
            padding: 11px 28px; border-radius: 7px; font-weight: 600;
            cursor: pointer; font-size: 14px; transition: background 0.2s ease;
        }
        .btn-modal-cancel:hover { background: #e8e8e8; }

        /* ===== Guest First Order Success Modal ===== */
        .guest-success-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .guest-success-modal-overlay.active {
            display: flex;
        }
        .guest-success-modal {
            background: #ffffff;
            border-radius: 12px;

            max-width: 480px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            animation: modalIn 0.25s cubic-bezier(.34,1.56,.64,1) both;

        .guest-success-modal__header {
            padding: 24px 24px 0;

        /* ===== Timeline: connect adjacent circles at their centers ===== */
        .timeline-stepper {
            --timeline-circle-size: 68px;
            --timeline-line-size: 4px;
            display: flex !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: flex-start !important;
            position: relative !important;
            padding: 24px 0 !important;
            margin: 20px 0 !important;
            width: 100% !important;
            overflow-x: auto;
            isolation: isolate;
        }
        .timeline-stepper-step {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            text-align: center !important;
            flex: 1 0 120px !important;
            min-width: 0;
            position: relative !important;
            width: auto !important;
        }
        .timeline-stepper-step + .timeline-stepper-step::before {
            content: "";
            position: absolute;
            top: calc((var(--timeline-circle-size) - var(--timeline-line-size)) / 2);
            left: -50%;
            width: 100%;
            height: var(--timeline-line-size);
            background-color: #e0e0e0;
            z-index: 0;
        }
        .timeline-stepper-step.finish + .timeline-stepper-step.finish::before {
            background-color: var(--step-color, #2ec155);
        }
        .timeline-stepper-icon-circle {
            box-sizing: border-box;
            width: var(--timeline-circle-size) !important;
            height: var(--timeline-circle-size) !important;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
            border-radius: 50% !important;
            background-color: #fff !important;
            border: 4px solid #e0e0e0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 20px !important;
            color: #bdbdbd !important;
            margin-bottom: 12px !important;
            transition: all 0.3s ease !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05) !important;
        }
        .timeline-stepper-step.active .timeline-stepper-icon-circle {
            border-color: var(--step-color, #2ec155) !important;
            color: var(--step-color, #2ec155) !important;
        }
        .timeline-stepper-step.finish .timeline-stepper-icon-circle {
            border-color: var(--step-color, #2ec155) !important;
            background-color: var(--step-color, #2ec155) !important;
            color: #fff !important;
        }
        .timeline-stepper-label {
            box-sizing: border-box;
            padding: 0 4px;
            font-size: 13px;
            font-weight: 700;
            color: #757575;
            margin-bottom: 4px;
            max-width: 140px;
            line-height: 1.3;
        }
        .timeline-stepper-step.active .timeline-stepper-label,
        .timeline-stepper-step.finish .timeline-stepper-label {
            color: #212121;
        }
        .timeline-stepper-time {
            font-size: 11px;
            color: #9e9e9e;
        }
        .timeline-stepper-step.active .timeline-stepper-time,
        .timeline-stepper-step.finish .timeline-stepper-time {
            color: #616161;
        }

        .order-header-section {

        .description-title {

        @media (max-width: 767.98px) {

                width: 100% !important;
                border-top: 1px dashed #eee !important;
                padding-top: 12px !important;
                gap: 16px !important;
            }
        }
